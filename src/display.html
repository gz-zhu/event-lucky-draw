<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Draw — Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: url('assets/images/Cover.jpg') center center / cover no-repeat fixed #1a1a1a;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* ── Canvas lights ── */
    canvas#lights {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Winner ticker (top bar) ── */
    .ticker {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2.4rem;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,215,0,0.25);
      display: flex;
      align-items: center;
      z-index: 20;
      overflow: hidden;
    }

    .ticker__label {
      font-size: 0.62rem;
      font-weight: 700;
      color: #ffd700;
      letter-spacing: 0.12em;
      padding: 0 1rem;
      white-space: nowrap;
      border-right: 1px solid rgba(255,255,255,0.15);
      height: 100%;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .ticker__track {
      flex: 1;
      overflow: hidden;
      height: 100%;
      display: flex;
      align-items: center;
    }

    .ticker__content {
      display: flex;
      align-items: center;
      gap: 2.5rem;
      white-space: nowrap;
      animation: ticker-scroll 25s linear infinite;
      padding-left: 100%;
    }

    @keyframes ticker-scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.85);
    }

    .ticker-item__prize {
      color: #ffd700;
      font-weight: 700;
      font-size: 0.68rem;
    }

    .ticker-item__sep { color: rgba(255,255,255,0.25); }

    /* ── Main layout: 2 columns ── */
    .display {
      position: relative;
      z-index: 1;
      height: 100vh;
      padding-top: 2.4rem; /* offset ticker */
      display: flex;
    }

    /* ── Left info panel ── */
    .info-panel {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 2rem 1.75rem 1.5rem;
      gap: 0.15rem;
      background: transparent;
      border-right: 1px solid rgba(255,255,255,0.06);
      overflow: hidden;
    }

    .info-title {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffdc15 0%, #eb4d4d 40%, #f5903d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.05em;
      line-height: 1.15;
      margin-bottom: 0.6rem;
      animation: title-glow 4s ease-in-out infinite alternate;
    }

    @keyframes title-glow {
      from { filter: drop-shadow(0 0 8px rgba(255,215,0,0.3)); }
      to   { filter: drop-shadow(0 0 20px rgba(255,215,0,0.7)); }
    }

    .info-clock {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: #fffafa;
      letter-spacing: 0.02em;
      text-shadow: 0 0 20px rgba(255,255,255,0.15);
      line-height: 1;
      white-space: nowrap;
    }

    .info-date {
      font-size: 1rem;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.08em;
      margin-top: 0.25rem;
      margin-bottom: 0.6rem;
    }

    .info-divider {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 0.6rem 0;
      flex-shrink: 0;
    }

    /* Countdown in info panel */
    .info-countdown {
      display: none;
      flex-direction: column;
      gap: 0.2rem;
    }

    .info-countdown.visible { display: flex; }

    .info-cd-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #ffd700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .info-cd-num {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 700;
      color: #ffd700;
      letter-spacing: 0.04em;
      text-shadow: 0 0 16px rgba(255,215,0,0.4);
      line-height: 1;
    }

    /* Stats block */
    .info-stats {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-top: auto;
      padding-top: 0.5rem;
    }

    .info-stat {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .info-stat__label {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .info-stat__num {
      font-size: 2.2rem;
      font-weight: 800;
      color: #ffd700;
      line-height: 1;
    }

    .info-seed {
      font-family: monospace;
      font-size: 0.58rem;
      color: rgba(255,215,0,0.3);
      letter-spacing: 0.08em;
      margin-top: 0.5rem;
      word-break: break-all;
    }

    /* ── Right prizes panel ── */
    .prizes-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem 1rem 1rem 1rem;
      overflow: hidden;
      min-width: 0;
    }

    .prizes-panel__title {
      font-size: 0.58rem;
      font-weight: 700;
      color: rgba(255,215,0,0.6);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      margin-bottom: 0.75rem;
      flex-shrink: 0;
    }

    .prizes-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0.75rem;
      overflow-y: auto;
      align-content: start;
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

    /* ── Prize card ── */
    .prize-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 0.7rem;
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: border-color 0.2s;
    }

    .prize-card--done {
      border-color: rgba(76,175,80,0.25);
      background: rgba(76,175,80,0.04);
    }

    .prize-card__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .prize-card__name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffd700;
      letter-spacing: 0.04em;
      line-height: 1.2;
    }

    .prize-card__desc {
      font-size: 0.72rem;
      color: rgba(255,215,0,0.6);
      margin-top: 0.18rem;
      line-height: 1.3;
    }

    .prize-card__badges {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.25rem;
      flex-shrink: 0;
    }

    .badge {
      padding: 0.2rem 0.6rem;
      border-radius: 2rem;
      font-size: 0.6rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge--done {
      background: rgba(76,175,80,0.18);
      color: #4caf50;
      border: 1px solid rgba(76,175,80,0.3);
    }

    .badge--pending {
      background: rgba(255,215,0,0.14);
      color: #ffd700;
      border: 1px solid rgba(255,215,0,0.3);
    }

    .prize-card__time {
      font-size: 0.62rem;
      color: rgba(255,215,0,0.6);
      white-space: nowrap;
    }

    /* Remaining slots row */
    .prize-card__slots {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .prize-card__rem {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      line-height: 1;
    }

    .prize-card--done .prize-card__rem { color: rgba(76,175,80,0.7); }

    .prize-card__rem-label {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      line-height: 1.3;
    }

    /* Progress bar */
    .prize-card__progress {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .prize-card__progress-fill {
      height: 100%;
      background: #ffd700;
      border-radius: 2px;
      transition: width 0.4s;
    }

    .prize-card--done .prize-card__progress-fill { background: #4caf50; }

    /* Winners list */
    .prize-card__winners {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .winner-chip {
      background: rgba(255,255,255,0.06);
      border-left: 2px solid rgba(255,215,0,0.3);
      border-radius: 0.3rem;
      padding: 0.22rem 0.55rem;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.8);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .prize-card--done .winner-chip {
      border-left-color: rgba(76,175,80,0.4);
    }

    .winner-ts {
      font-size: 0.6rem;
      color: rgba(255,255,255,0.28);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .prize-card__pending {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.22);
      font-style: italic;
    }

    @media (max-width: 700px) {
      .display { flex-direction: column; overflow-y: auto; }
      .info-panel { width: 100%; border-right: none; border-bottom: 1px solid rgba(255,215,0,0.1); padding: 1rem; }
      .info-clock { font-size: 0.7rem; }
      .prizes-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<canvas id="lights"></canvas>
<div id="fb-status" style="position:fixed;bottom:0.5rem;right:0.75rem;font-size:0.65rem;color:rgba(255,255,255,0.3);z-index:50;pointer-events:none">⚪ sync</div>

<!-- Winners ticker -->
<div class="ticker">
  <div class="ticker__label">WINNERS</div>
  <div class="ticker__track">
    <div class="ticker__content" id="ticker-content"></div>
  </div>
</div>

<div class="display">

  <!-- Left: Info panel (clock, countdown, stats) -->
  <div class="info-panel">
    <div class="info-title">Lucky<br>Draw</div>
    <div class="info-clock" id="clock">00:00:00</div>
    <div class="info-date" id="date-display"></div>

    <!-- Countdown (hidden until active) -->
    <div class="info-divider" id="countdown-divider" style="display:none"></div>
    <div class="info-countdown" id="countdown-wrap">
      <div class="info-cd-label" id="countdown-label"></div>
      <div class="info-cd-num" id="countdown-display">--:--</div>
    </div>

    <div class="info-divider"></div>

    <!-- Stats -->
    <div class="info-stats">
      <div class="info-stat">
        <span class="info-stat__label">Participants</span>
        <span class="info-stat__num" id="stat-participants">—</span>
      </div>
      <div class="info-stat">
        <span class="info-stat__label">Winners</span>
        <span class="info-stat__num" id="stat-winners">0</span>
      </div>
      <div class="info-stat">
        <span class="info-stat__label">Remaining</span>
        <span class="info-stat__num" id="stat-remaining">0</span>
      </div>
    </div>

    <div class="info-seed" id="seed-display" style="display:none"></div>
  </div>

  <!-- Right: Prize cards -->
  <div class="prizes-panel">
    <div class="prizes-panel__title">Prizes</div>
    <div class="prizes-grid" id="prizes-body"></div>
  </div>

</div>

<script>
  // ── Background lights ──────────────────────────────────────
  const cv = document.getElementById('lights');
  const cx = cv.getContext('2d');
  function resizeCv() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
  resizeCv();
  window.addEventListener('resize', resizeCv);

  const COLS = ['#ff4444','#ff8800','#ffdd00','#44ff44','#44aaff','#aa44ff','#ff44aa','#ffffff'];
  const pts = Array.from({length: 75}, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: Math.random() * 3 + 1.5,
    c: COLS[Math.floor(Math.random() * COLS.length)],
    a: Math.random(),
    s: Math.random() * 0.012 + 0.005,
    p: Math.random() * Math.PI * 2
  }));

  function drawLights(t) {
    cx.clearRect(0, 0, cv.width, cv.height);
    pts.forEach(l => {
      l.a = 0.25 + 0.75 * Math.abs(Math.sin(t * l.s + l.p));
      cx.save();
      cx.globalAlpha = l.a * 0.45;
      cx.shadowBlur = 8;
      cx.shadowColor = l.c;
      cx.fillStyle = l.c;
      cx.beginPath();
      cx.arc(l.x, l.y, l.r, 0, Math.PI * 2);
      cx.fill();
      cx.restore();
    });
    requestAnimationFrame(drawLights);
  }
  requestAnimationFrame(drawLights);

  // ── Clock ──────────────────────────────────────────────────
  function tick() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('en-GB');
    document.getElementById('date-display').textContent =
      now.toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }
  setInterval(tick, 1000); tick();

  // ── Mask name ──────────────────────────────────────────────
  function mask(name) {
    return name.split(/(\s+|—|-)/).map(p => {
      if (/^\s+$/.test(p) || p === '—' || p === '-') return p;
      if (p.length <= 2) return p;
      const keep = Math.ceil(p.length / 3);
      return p.slice(0, keep) + '***';
    }).join('');
  }

  // ── Load data ──────────────────────────────────────────────
  function load() {
    try { return JSON.parse(localStorage.getItem('prize-manager-data') || '[]'); }
    catch(e) { return []; }
  }

  // ── Render prize cards (combined winners + upcoming) ───────
  function renderPrizes(prizes) {
    const body = document.getElementById('prizes-body');
    body.innerHTML = '';

    prizes.forEach(p => {
      const done = p.winners.length >= p.count;
      const rem = Math.max(0, p.count - p.winners.length);
      const filled = p.count > 0 ? (p.winners.length / p.count) : 0;

      const card = document.createElement('div');
      card.className = 'prize-card' + (done ? ' prize-card--done' : '');

      // Header: name + badges
      const badgeHtml = '<div class="badge ' + (done ? 'badge--done' : 'badge--pending') + '">'
        + (done ? '✓ Done' : 'Upcoming') + '</div>'
        + (p.drawTime ? '<div class="prize-card__time">⏰ ' + p.drawTime + '</div>' : '');

      const descHtml = p.description
        ? '<div class="prize-card__desc">' + p.description + '</div>' : '';

      card.innerHTML = '<div class="prize-card__header">'
        + '<div><div class="prize-card__name">' + p.name + '</div>' + descHtml + '</div>'
        + '<div class="prize-card__badges">' + badgeHtml + '</div>'
        + '</div>'
        // Remaining slots
        + '<div class="prize-card__slots">'
        + '<div class="prize-card__rem">' + rem + '</div>'
        + '<div class="prize-card__rem-label">spot' + (rem !== 1 ? 's' : '') + '<br>remaining</div>'
        + '</div>'
        // Progress bar
        + '<div class="prize-card__progress"><div class="prize-card__progress-fill" style="width:' + Math.round(filled * 100) + '%"></div></div>';

      // Winners list
      if (p.winners.length) {
        const wrapEl = document.createElement('div');
        wrapEl.className = 'prize-card__winners';
        p.winners.forEach((w, i) => {
          const chip = document.createElement('div');
          chip.className = 'winner-chip';
          const ts = p.winnerTimestamps && p.winnerTimestamps[i] ? p.winnerTimestamps[i] : '';
          chip.innerHTML = '<span>' + mask(w) + '</span>'
            + (ts ? '<span class="winner-ts">' + ts + '</span>' : '');
          wrapEl.appendChild(chip);
        });
        card.appendChild(wrapEl);
      } else if (!done) {
        const pend = document.createElement('div');
        pend.className = 'prize-card__pending';
        pend.textContent = 'No winners yet';
        card.appendChild(pend);
      }

      body.appendChild(card);
    });
  }

  // ── Render ticker ──────────────────────────────────────────
  function renderTicker(prizes) {
    const content = document.getElementById('ticker-content');
    const items = prizes.flatMap(p =>
      p.winners.map(w => ({ prize: p.name, winner: w }))
    );
    if (!items.length) { content.innerHTML = '<span style="color:rgba(255,255,255,0.3);font-size:0.75rem">No winners yet</span>'; return; }
    content.innerHTML = items.map(it =>
      '<span class="ticker-item">'
      + '<span class="ticker-item__prize">' + it.prize + '</span>'
      + '<span class="ticker-item__sep">·</span>'
      + mask(it.winner)
      + '</span>'
    ).join('');
  }

  // ── Render stats ───────────────────────────────────────────
  function renderStats(prizes) {
    const total = prizes.reduce((s, p) => s + p.winners.length, 0);
    const rem = prizes.reduce((s, p) => s + Math.max(0, p.count - p.winners.length), 0);
    document.getElementById('stat-winners').textContent = total;
    document.getElementById('stat-remaining').textContent = rem;
    const participants = localStorage.getItem('draw-participant-count');
    const participantsEl = document.getElementById('stat-participants');
    if (participantsEl && participants !== null) participantsEl.textContent = participants;
    const seed = localStorage.getItem('draw-last-seed');
    const seedEl = document.getElementById('seed-display');
    if (seedEl && seed) {
      seedEl.textContent = 'SEED · ' + seed;
      seedEl.style.display = 'block';
    }
  }

  // ── Refresh all ────────────────────────────────────────────
  let lastDataHash = '';
  function refresh() {
    const prizes = load();
    const hash = JSON.stringify(prizes);
    if (hash === lastDataHash) return;
    lastDataHash = hash;
    renderPrizes(prizes);
    renderTicker(prizes);
    renderStats(prizes);
  }

  // Firebase realtime sync
  const fbStatus = document.getElementById('fb-status');
  import('https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js').then(({ initializeApp }) => {
    import('https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js').then(({ getDatabase, ref, onValue }) => {
      const firebaseConfig = {
        apiKey: 'AIzaSyBzJJ3yeO-_Yozikwds9_6PPwyAn788SHU',
        databaseURL: 'https://event-luckydraw-default-rtdb.asia-southeast1.firebasedatabase.app',
        projectId: 'event-luckydraw',
        appId: '1:186125547633:web:e94e9fab2ba797ffe3c3d0'
      };
      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      onValue(ref(db, 'prizes'), function(snapshot) {
        var data = snapshot.val();
        if (data) {
          localStorage.setItem('prize-manager-data', JSON.stringify(data));
          refresh();
        }
        if (fbStatus) { fbStatus.textContent = '🟢 synced'; fbStatus.style.color = 'rgba(100,255,150,0.5)'; }
      }, function() {
        if (fbStatus) { fbStatus.textContent = '🔴 offline'; fbStatus.style.color = 'rgba(255,100,100,0.6)'; }
      });
      // Listen to countdown state from main app
      onValue(ref(db, 'countdown'), function(snapshot) {
        var state = snapshot.val();
        var raw = state ? JSON.stringify(state) : '';
        localStorage.setItem('draw-countdown', raw);
        lastCdHash = raw;
        applyCountdownState(state);
      });
    });
  }).catch(() => {
    if (fbStatus) { fbStatus.textContent = '🔴 offline'; fbStatus.style.color = 'rgba(255,100,100,0.6)'; }
  });

  refresh();
  setInterval(refresh, 2000);
  // Instant sync when main app writes to localStorage on the same device
  window.addEventListener('storage', function(e) {
    if (e.key === 'prize-manager-data') refresh();
  });

  // ── Countdown (read-only, driven by main app via Firebase) ───
  let cdTimer = null;
  let cdSecs = 0;

  function fmtCd(s) {
    return String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(Math.max(0,s) % 60).padStart(2,'0');
  }

  const cdEl = document.getElementById('countdown-display');
  const cdDivider = document.getElementById('countdown-divider');
  const cdLabel = document.getElementById('countdown-label');
  const cdWrap = document.getElementById('countdown-wrap');

  function showCountdown(show) {
    if (cdDivider) cdDivider.style.display = show ? 'block' : 'none';
    if (cdWrap) cdWrap.classList.toggle('visible', show);
  }

  function getPrizeName(prizeId) {
    try {
      var prizes = load();
      var p = prizes.find(function(x) { return x.id === prizeId; });
      return p ? p.name : '';
    } catch(e) { return ''; }
  }

  function showTimesUp(prizeName) {
    showCountdown(true);
    if (cdLabel) {
      cdLabel.textContent = (prizeName ? prizeName + '  ·  ' : '') + '🎉 TIME\'S UP!';
      cdLabel.style.color = '#FFEA60';
    }
    if (cdEl) { cdEl.textContent = '00:00'; cdEl.style.color = '#FFF260'; }
    setTimeout(function() { showCountdown(false); if (cdLabel) cdLabel.style.color = '#ffd700'; }, 10000);
  }

  function applyCountdownState(state) {
    if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
    if (!state || !state.minutes) { showCountdown(false); return; }
    var prizeName = getPrizeName(state.prizeId);
    var namePrefix = prizeName ? prizeName + '  ·  ' : '';
    showCountdown(true);
    if (state.running && state.startedAt) {
      var elapsed = Math.floor((Date.now() - state.startedAt) / 1000);
      cdSecs = Math.max(0, state.minutes * 60 - elapsed);
      if (cdSecs <= 0) { showTimesUp(prizeName); return; }
      cdTimer = setInterval(function() {
        cdSecs = Math.max(0, cdSecs - 1);
        if (cdEl) {
          cdEl.textContent = fmtCd(cdSecs);
          cdEl.style.color = cdSecs <= 30 && cdSecs > 0 ? '#FFEC60' : '#ffd700';
        }
        if (cdSecs <= 0) { clearInterval(cdTimer); cdTimer = null; showTimesUp(prizeName); }
      }, 1000);
      if (cdLabel) { cdLabel.textContent = namePrefix + '⏱ COUNTDOWN'; cdLabel.style.color = '#ffd700'; }
    } else {
      cdSecs = state.pausedRemaining !== null ? state.pausedRemaining : state.minutes * 60;
      if (cdLabel) { cdLabel.textContent = namePrefix + (state.pausedRemaining !== null ? '⏸ PAUSED' : '⏱ READY'); cdLabel.style.color = '#ffd700'; }
    }
    if (cdEl) { cdEl.textContent = fmtCd(cdSecs); cdEl.style.color = '#ffd700'; }
  }

  // Poll localStorage as same-device fallback
  var lastCdHash = '';
  function pollCountdown() {
    try {
      var raw = localStorage.getItem('draw-countdown') || '';
      if (raw !== lastCdHash) {
        lastCdHash = raw;
        applyCountdownState(raw ? JSON.parse(raw) : null);
      }
    } catch(e) {}
  }
  setInterval(pollCountdown, 1000);
  applyCountdownState(null);
</script>
</body>
</html>
