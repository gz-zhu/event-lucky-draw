<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Draw — Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: url('assets/images/Cover.jpg') center center / cover no-repeat fixed #1a1a1a;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* ── Canvas lights ── */
    canvas#lights {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Winner ticker (top bar) ── */
    .ticker {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2.4rem;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,215,0,0.25);
      display: flex;
      align-items: center;
      z-index: 20;
      overflow: hidden;
    }

    .ticker__label {
      font-size: 0.62rem;
      font-weight: 700;
      color: #ffd700;
      letter-spacing: 0.12em;
      padding: 0 1rem;
      white-space: nowrap;
      border-right: 1px solid rgba(255,255,255,0.15);
      height: 100%;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .ticker__track {
      flex: 1;
      overflow: hidden;
      height: 100%;
      display: flex;
      align-items: center;
    }

    .ticker__content {
      display: flex;
      align-items: center;
      gap: 2.5rem;
      white-space: nowrap;
      animation: ticker-scroll 25s linear infinite;
      padding-left: 100%;
    }

    @keyframes ticker-scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.85);
    }

    .ticker-item__prize {
      color: #ffd700;
      font-weight: 700;
      font-size: 0.68rem;
    }

    .ticker-item__sep { color: rgba(255,255,255,0.25); }

    /* ── Main layout: 2 columns ── */
    .display {
      position: relative;
      z-index: 1;
      height: 100vh;
      padding-top: 2.4rem; /* offset ticker */
      display: flex;
    }

    /* ── Left info panel ── */
    .info-panel {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 2rem 1.75rem 1.5rem;
      gap: 0.15rem;
      background: transparent;
      border-right: 1px solid rgba(255,255,255,0.06);
      overflow: hidden;
    }

    .info-title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(
        160deg,
        #ff9a00 0%,
        #ffd000 18%,
        #fffbe0 38%,
        #ffd700 52%,
        #ffb300 68%,
        #fff0a0 82%,
        #e67e00 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.05em;
      line-height: 1.15;
      margin-bottom: 0.6rem;
      filter: drop-shadow(0 1px 0 rgba(180, 60, 0, 0.6))
        drop-shadow(0 0 20px rgba(255, 170, 0, 0.55))
        drop-shadow(0 4px 12px rgba(0, 0, 0, 0.55));
      animation: brand-shine 5s ease-in-out infinite alternate;
    }

    @keyframes brand-shine {
      0% {
        filter: drop-shadow(0 1px 0 rgba(180, 60, 0, 0.55))
          drop-shadow(0 0 12px rgba(255, 150, 0, 0.4))
          drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
      }
      100% {
        filter: drop-shadow(0 2px 0 rgba(220, 80, 0, 0.75))
          drop-shadow(0 0 32px rgba(255, 200, 0, 0.8))
          drop-shadow(0 4px 16px rgba(0, 0, 0, 0.6));
      }
    }

    .info-clock {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: #fffafa;
      letter-spacing: 0.02em;
      text-shadow: 0 0 20px rgba(255,255,255,0.15);
      line-height: 1;
      white-space: nowrap;
    }

    .info-date {
      font-size: 0.82rem;
      font-weight: 500;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.08em;
      margin-top: 0.2rem;
      margin-bottom: 0.5rem;
    }

    .info-divider {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 0.6rem 0;
      flex-shrink: 0;
    }

    /* Countdown in info panel */
    .info-countdown {
      display: none;
      flex-direction: column;
      gap: 0.2rem;
    }

    .info-countdown.visible { display: flex; }

    .info-cd-label {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      font-size: 1rem;
      font-weight: 700;
      background: linear-gradient(160deg, #ff9a00 0%, #ffd000 18%, #fffbe0 38%, #ffd700 52%, #ffb300 68%, #fff0a0 82%, #e67e00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.09em;
      filter: drop-shadow(0 1px 0 rgba(180,60,0,0.6)) drop-shadow(0 0 12px rgba(255,170,0,0.55));
      animation: brand-shine 5s ease-in-out infinite alternate;
      line-height: 1.05;
    }

    .info-cd-label__prize {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .info-cd-label__state {
      font-size: 1.08rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .info-cd-num {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(160deg, #ff9a00 0%, #ffd000 18%, #fffbe0 38%, #ffd700 52%, #ffb300 68%, #fff0a0 82%, #e67e00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.04em;
      filter: drop-shadow(0 1px 0 rgba(180,60,0,0.6)) drop-shadow(0 0 20px rgba(255,170,0,0.55)) drop-shadow(0 4px 12px rgba(0,0,0,0.55));
      animation: brand-shine 5s ease-in-out infinite alternate;
      line-height: 1;
    }

    /* Stats block */
    .info-stats {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-top: auto;
      padding-top: 0.5rem;
    }

    .info-stat {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .info-stat__label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .info-stat__num {
      font-size: 1.35rem;
      font-weight: 700;
      color: rgba(255,215,0,0.85);
      line-height: 1;
    }

    .info-seed {
      font-family: monospace;
      font-size: 0.58rem;
      color: rgba(255,215,0,0.3);
      letter-spacing: 0.08em;
      margin-top: 0.5rem;
      word-break: break-all;
    }

    /* ── Right prizes panel ── */
    .prizes-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem 1rem 1rem 1rem;
      overflow: hidden;
      min-width: 0;
    }

    .prizes-panel__title {
      font-size: 0.72rem;
      font-weight: 700;
      color: rgba(255,215,0,0.55);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      margin-bottom: 0.75rem;
      flex-shrink: 0;
    }

    .draw-event-title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      /* Platinum / white-gold texture */
      background: linear-gradient(
        160deg,
        #e8e0d0 0%,
        #fffef8 22%,
        #d4c8a8 38%,
        #ffffff 52%,
        #e0d8c4 65%,
        #faf8f0 80%,
        #c8bea0 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 1px 0 rgba(120,100,60,0.35))
        drop-shadow(0 0 22px rgba(255,255,220,0.3))
        drop-shadow(0 3px 12px rgba(0,0,0,0.5));
      animation: title-platinum 6s ease-in-out infinite alternate;
      letter-spacing: 0.1em;
      line-height: 1.2;
      margin-bottom: 0.5rem;
      flex-shrink: 0;
    }

    .display-live {
      position: relative;
      width: min(100%, 47rem);
      margin: 0 auto 1.05rem;
      padding: 0.2rem 0 0.35rem;
      flex-shrink: 0;
    }

    .display-live::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(255, 235, 200, 0.14), transparent 58%);
      pointer-events: none;
      opacity: 0.9;
    }

    .display-live__header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.4rem;
      padding: 0 0.15rem;
    }

    .display-live__eyebrow {
      font-size: 0.56rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 215, 0, 0.7);
    }

    .display-live__prize {
      margin-top: 0.12rem;
      font-size: 0.9rem;
      font-weight: 700;
      color: rgba(255,255,255,0.92);
      letter-spacing: 0.04em;
      min-height: 1rem;
    }

    .display-live__status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0.52rem;
      border-radius: 999px;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.82);
      background: rgba(24, 25, 34, 0.34);
      border: 1px solid rgba(255,255,255,0.18);
      flex-shrink: 0;
    }

    .display-live__status::before {
      content: '';
      width: 0.48rem;
      height: 0.48rem;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    .display-live.is-spinning .display-live__status {
      color: #ffe9b5;
      background: rgba(255, 166, 0, 0.12);
      border-color: rgba(255, 200, 92, 0.34);
    }

    .display-live.is-spinning .display-live__status::before {
      background: #ffd35c;
      box-shadow: 0 0 14px rgba(255, 211, 92, 0.8);
      animation: slot-pulse 1s ease-in-out infinite;
    }

    .display-live.is-settled .display-live__status {
      color: #dbffea;
      background: rgba(78, 196, 124, 0.14);
      border-color: rgba(125, 221, 128, 0.3);
    }

    .display-live.is-settled .display-live__status::before {
      background: #7ddb80;
      box-shadow: 0 0 14px rgba(125, 221, 128, 0.75);
    }

    .display-live__slot {
      position: relative;
      z-index: 1;
      width: min(100%, 43rem);
      margin: 0 auto;
    }

    .display-live__slot-shell {
      position: relative;
      border-radius: 1rem;
      padding: 0.7rem;
      min-height: 5.15rem;
      background:
        rgba(255, 255, 255, 0.14) url('assets/images/light-blubs.svg') center center / cover no-repeat,
        linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.26);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.16),
        0 12px 26px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .display-live__slot-shell::before {
      content: '';
      position: absolute;
      inset: 0.48rem;
      border-radius: 0.85rem;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02)),
        rgba(210, 220, 232, 0.04);
      box-shadow: inset 0 -16px 30px rgba(27, 34, 43, 0.08);
      pointer-events: none;
    }

    .display-live__slot-shell::after {
      content: '';
      position: absolute;
      inset: 0.22rem;
      border-radius: 0.92rem;
      border: 1px solid rgba(255,255,255,0.12);
      pointer-events: none;
    }

    .display-live__lights {
      position: absolute;
      inset: 0.18rem;
      border-radius: 0.92rem;
      pointer-events: none;
      overflow: hidden;
    }

    .display-live__bulb {
      position: absolute;
      width: 0.54rem;
      height: 0.54rem;
      margin: -0.27rem 0 0 -0.27rem;
      border-radius: 50%;
      background: rgba(255,255,255,0.38);
      opacity: 0.34;
      transform: scale(0.9);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.18),
        0 0 2px rgba(255,255,255,0.12);
      transition:
        opacity 140ms linear,
        transform 140ms linear,
        background 140ms linear,
        box-shadow 140ms linear;
    }

    .display-live__bulb.is-lit {
      background: rgba(255,255,255,0.98);
      opacity: 1;
      transform: scale(1);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.26),
        0 0 8px rgba(255,255,255,0.95),
        0 0 16px rgba(255,255,255,0.72);
    }

    .display-live__slot-window {
      position: relative;
      z-index: 1;
      min-height: 3.55rem;
      width: calc(100% - 1.2rem);
      margin: 0.38rem auto;
      border-radius: 0.82rem;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.06)),
        rgba(231, 238, 246, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.45rem 1.25rem;
      overflow: hidden;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.2),
        inset 0 -18px 28px rgba(10, 18, 28, 0.1);
    }

    .display-live__slot-window::before,
    .display-live__slot-window::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 28%;
      pointer-events: none;
      z-index: 1;
    }

    .display-live__slot-window::before {
      top: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.2), rgba(255,255,255,0));
    }

    .display-live__slot-window::after {
      bottom: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0), rgba(10, 18, 28, 0.08));
    }

    .display-live__reel {
      position: relative;
      z-index: 0;
      width: 100%;
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.25rem, 2.2vw, 2.1rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: 0.02em;
      color: transparent;
      background: linear-gradient(180deg, #ffffff 0%, #edf2f8 32%, #ffffff 56%, #cbd4df 82%, #f6f8fb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 2px 14px rgba(255,255,255,0.18);
      transition: transform 0.2s ease, opacity 0.2s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .display-live.is-spinning .display-live__reel {
      animation: reel-flicker 0.12s linear infinite;
    }

    .display-live.is-settled .display-live__reel {
      color: #ffffff;
      -webkit-text-fill-color: #ffffff;
      text-shadow:
        0 0 10px rgba(255,255,255,0.4),
        0 0 26px rgba(255,255,255,0.34),
        0 0 40px rgba(255, 215, 120, 0.26);
      animation: aftermath-pulse-display 1.35s ease-in-out infinite;
    }

    .display-live__hint {
      position: relative;
      z-index: 1;
      margin-top: 0.38rem;
      font-size: 0.62rem;
      color: rgba(255,255,255,0.48);
      letter-spacing: 0.06em;
      min-height: 0.8rem;
      text-align: center;
    }

    @keyframes slot-pulse {
      0%, 100% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    @keyframes reel-flicker {
      0% { transform: translateY(-7%); opacity: 0.84; filter: blur(0.4px); }
      100% { transform: translateY(7%); opacity: 1; filter: blur(0); }
    }

    @keyframes aftermath-pulse-display {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }

    @keyframes title-platinum {
      from {
        filter: drop-shadow(0 1px 0 rgba(120,100,60,0.3))
          drop-shadow(0 0 14px rgba(255,255,220,0.2))
          drop-shadow(0 3px 10px rgba(0,0,0,0.45));
      }
      to {
        filter: drop-shadow(0 1px 0 rgba(160,140,80,0.45))
          drop-shadow(0 0 30px rgba(255,255,230,0.45))
          drop-shadow(0 3px 14px rgba(0,0,0,0.55));
      }
    }

    .prizes-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.65rem;
      overflow-y: auto;
      align-content: start;
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

    /* ── Prize card ── */
    .prize-card {
      background: rgba(18,12,8,0.28);
      border: 1px solid rgba(255,255,255,0.18);
      border-top: 1px solid rgba(255,255,255,0.28);
      border-radius: 0.9rem;
      padding: 0.7rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      transition: border-color 0.2s, background 0.2s;
      backdrop-filter: blur(20px) saturate(1.6) brightness(0.92);
      -webkit-backdrop-filter: blur(20px) saturate(1.6) brightness(0.92);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12),
        0 4px 24px rgba(0,0,0,0.25);
    }

    .prize-card--done {
      border-color: rgba(76,175,80,0.35);
      border-top-color: rgba(100,210,100,0.4);
      background: rgba(8,28,10,0.28);
    }

    .prize-card__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.6rem;
    }

    .prize-card__name {
      font-size: 0.95rem;
      font-weight: 400;
      color: #ffe44d;
      letter-spacing: 0.02em;
      line-height: 1.2;
      text-shadow: 0 1px 4px rgba(255,215,0,0.3);
    }

    .prize-card__desc {
      font-size: 0.75rem;
      font-weight: 350;
      color: rgba(255,255,255,0.85);
      margin-top: 0.08rem;
      line-height: 1.3;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }

    .prize-card__badges {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.3rem;
      flex-shrink: 0;
    }

    .badge {
      padding: 0.18rem 0.55rem;
      border-radius: 2rem;
      font-size: 0.65rem;
      font-weight: 400;
      white-space: nowrap;
    }

    .badge--done {
      background: rgba(76,175,80,0.25);
      color: #7ddb80;
      border: 1px solid rgba(76,175,80,0.5);
    }

    .badge--pending {
      background: rgba(255,215,0,0.2);
      color: #ffe44d;
      border: 1px solid rgba(255,215,0,0.5);
    }

    .prize-card__time {
      font-size: 0.65rem;
      font-weight: 400;
      color: rgba(255,228,77,0.8);
      white-space: nowrap;
    }

    /* Remaining slots row */
    .prize-card__slots {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .prize-card__rem {
      font-size: 1.15rem;
      font-weight: 400;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 8px rgba(255,255,255,0.25);
    }

    .prize-card--done .prize-card__rem { color: #7ddb80; text-shadow: 0 0 8px rgba(76,175,80,0.4); }

    .prize-card__rem-label {
      font-size: 0.6rem;
      font-weight: 400;
      color: rgba(255,255,255,0.55);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      line-height: 1.3;
    }

    /* Progress bar */
    .prize-card__progress {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.12);
      border-radius: 2px;
      overflow: hidden;
    }

    .prize-card__progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #ffd700, #ffe44d);
      border-radius: 2px;
      transition: width 0.4s;
    }

    .prize-card--done .prize-card__progress-fill { background: linear-gradient(90deg, #4caf50, #7ddb80); }

    /* Winners list */
    .prize-card__winners {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .winner-chip {
      background: rgba(255,255,255,0.07);
      border-left: 2px solid rgba(255,215,0,0.5);
      border-radius: 0.3rem;
      padding: 0.28rem 0.5rem;

<script>
  // ── i18n (mirrors i18n.ts display strings) ─────────────────
  var DISPLAY_I18N = {
    en: {
      participants: 'Participants', winners: 'Winners', remaining: 'Remaining',
      prizes: 'Prizes', done: '✓ Done', upcoming: 'Upcoming',
      spotsLine1: 'spots', spotsLine2: 'remaining',
      noWinnersYet: 'No winners yet',
      countdown: '⏱ COUNTDOWN', paused: '⏸ PAUSED', ready: '⏱ READY',
      timesUp: '🎉 TIME\'S UP!', tickerLabel: '🏆 WINNERS', seedLabel: 'SEED',
      locale: 'en-GB'
    },
    zh: {
      participants: '參加者', winners: '得獎者', remaining: '剩餘',
      prizes: '獎項', done: '✓ 已完成', upcoming: '即將開抽',
      spotsLine1: '個名額', spotsLine2: '剩餘',
      noWinnersYet: '尚未開抽',
      countdown: '⏱ 倒數中', paused: '⏸ 已暫停', ready: '⏱ 準備就緒',
      timesUp: '🎉 時間到！', tickerLabel: '🏆 得獎名單', seedLabel: '種子',
      locale: 'zh-TW'
    },
    ja: {
      participants: '参加者', winners: '当選者', remaining: '残り',
      prizes: '賞一覧', done: '✓ 終了', upcoming: '抽選待ち',
      spotsLine1: '名', spotsLine2: '残り',
      noWinnersYet: 'まだ当選者はいません',
      countdown: '⏱ カウントダウン', paused: '⏸ 一時停止', ready: '⏱ 準備完了',
      timesUp: '🎉 時間終了！', tickerLabel: '🏆 当選者', seedLabel: 'シード',
      locale: 'ja-JP'
    },
    my: {
      participants: 'ပါဝင်သူများ', winners: 'အနိုင်ရသူများ', remaining: 'ကျန်သော',
      prizes: 'ဆုများ', done: '✓ ပြီးဆုံး', upcoming: 'မဆုဖွင့်ရသေး',
      spotsLine1: 'နေရာ', spotsLine2: 'ကျန်တော့',
      noWinnersYet: 'မည်သူမျှ မအနိုင်ရသေး',
      countdown: '⏱ အချိန်ကုန်ဆုံးချိန်', paused: '⏸ ရပ်ဆိုင်းထား', ready: '⏱ အသင့်ဖြစ်',
      timesUp: '🎉 အချိန်ကုန်ပြီ!', tickerLabel: '🏆 အနိုင်ရသူများ', seedLabel: 'SEED',
      locale: 'my-MM'
    }
  };

  var currentLang = 'en';
  try {
    var saved = localStorage.getItem('app-lang');
    if (saved === 'zh' || saved === 'ja' || saved === 'my') currentLang = saved;
  } catch(e) {}
  var i18n = DISPLAY_I18N[currentLang];

  function applyStaticText() {
    i18n = DISPLAY_I18N[currentLang];
    var el;
    el = document.getElementById('ticker-label'); if (el) el.textContent = i18n.tickerLabel;
    el = document.getElementById('stat-label-participants'); if (el) el.textContent = i18n.participants;
    el = document.getElementById('stat-label-winners'); if (el) el.textContent = i18n.winners;
    el = document.getElementById('stat-label-remaining'); if (el) el.textContent = i18n.remaining;
    el = document.getElementById('prizes-panel-title'); if (el) el.textContent = i18n.prizes;
  }

  // ── Background lights ──────────────────────────────────────
  const cv = document.getElementById('lights');
  const cx = cv.getContext('2d');
  function resizeCv() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
  resizeCv();
  window.addEventListener('resize', resizeCv);

  const COLS = ['#ff4444','#ff8800','#ffdd00','#44ff44','#44aaff','#aa44ff','#ff44aa','#ffffff'];
  const pts = Array.from({length: 130}, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: Math.random() * 3.5 + 0.5,
    c: COLS[Math.floor(Math.random() * COLS.length)],
    a: Math.random(),
    s: Math.random() * 0.012 + 0.005,
    p: Math.random() * Math.PI * 2
  }));

  function drawLights(t) {
    cx.clearRect(0, 0, cv.width, cv.height);
    pts.forEach(l => {
      l.a = 0.25 + 0.75 * Math.abs(Math.sin(t * l.s + l.p));
      cx.save();
      cx.globalAlpha = l.a * 0.45;
      cx.shadowBlur = 8;
      cx.shadowColor = l.c;
      cx.fillStyle = l.c;
      cx.beginPath();
      cx.arc(l.x, l.y, l.r, 0, Math.PI * 2);
      cx.fill();
      cx.restore();
    });
    requestAnimationFrame(drawLights);
  }
  requestAnimationFrame(drawLights);

  // ── Clock ──────────────────────────────────────────────────
  function tick() {
    var now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB');
    document.getElementById('date-display').textContent =
      now.toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }
  setInterval(tick, 1000); tick();

  // ── Load data ──────────────────────────────────────────────
  function load() {
    try { return JSON.parse(localStorage.getItem('prize-manager-data') || '[]'); }
    catch(e) { return []; }
  }

  function loadArrayStorage(key) {
    try {
      var raw = localStorage.getItem(key);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed.filter(function(name) { return typeof name === 'string'; }) : [];
    } catch(e) {
      return [];
    }
  }

  function maskName(name) {
    return String(name || '').split(/(\s+|—|-)/).map(function(part) {
      if (/^\s+$/.test(part) || part === '—' || part === '-') return part;
      if (part.length <= 2) return part;
      var keep = Math.ceil(part.length / 3);
      return part.slice(0, keep) + '***';
    }).join('');
  }

  function getRecoveryPending() {
    try { return localStorage.getItem('draw-recovery-pending') === '1'; }
    catch(e) { return false; }
  }

  const liveWrapEl = document.getElementById('display-live');
  const livePrizeEl = document.getElementById('display-live-prize');
  const liveStatusEl = document.getElementById('display-live-status');
  const liveReelEl = document.getElementById('display-live-reel');
  const liveHintEl = document.getElementById('display-live-hint');
  const liveLightsEl = document.getElementById('display-live-lights');
  let liveSpinTimer = null;
  let liveSpinNamesHash = '';
  let lastDetectedWinner = null;
  let previousPrizesSnapshot = [];
  let liveBulbTimer = null;
  let liveBulbs = [];

  function buildLiveBulbs() {
    if (!liveLightsEl) return;
    liveLightsEl.innerHTML = '';
    liveBulbs = [];

    var rect = liveLightsEl.getBoundingClientRect();
    var width = Math.max(0, rect.width);
    var height = Math.max(0, rect.height);
    if (!width || !height) return;

    var rootFontSize = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    var inset = 0.72 * rootFontSize;
    var spacing = 3.2 * rootFontSize;

    var topCount = Math.max(2, Math.round((width - inset * 2) / spacing) + 1);
    var sideCount = Math.max(2, Math.round((height - inset * 2) / spacing) + 1);

    function createBulb(x, y, edge, indexOnEdge) {
      var bulb = document.createElement('span');
      bulb.className = 'display-live__bulb';
      bulb.style.left = x + 'px';
      bulb.style.top = y + 'px';
      bulb.dataset.edge = edge;
      bulb.dataset.edgeIndex = String(indexOnEdge);
      liveLightsEl.appendChild(bulb);
      liveBulbs.push(bulb);
    }

    for (var i = 0; i < topCount; i += 1) {
      var x = inset + ((width - inset * 2) * i / Math.max(1, topCount - 1));
      createBulb(x, inset, 'top', i);
      createBulb(x, height - inset, 'bottom', i);
    }

    for (var j = 1; j < sideCount - 1; j += 1) {
      var y = inset + ((height - inset * 2) * j / Math.max(1, sideCount - 1));
      createBulb(inset, y, 'left', j);
      createBulb(width - inset, y, 'right', j);
    }
  }

  function animateLiveBulbs() {
    if (!liveBulbs.length) return;
    if (liveBulbTimer) clearInterval(liveBulbTimer);

    var phase = 0;
    liveBulbTimer = setInterval(function() {
      phase = (phase + 1) % 6;
      liveBulbs.forEach(function(bulb) {
        var edge = bulb.dataset.edge || 'top';
        var edgeIndex = parseInt(bulb.dataset.edgeIndex || '0', 10);
        var edgeShift = edge === 'top' ? 0 : edge === 'right' ? 1 : edge === 'bottom' ? 2 : 3;
        var lit = ((edgeIndex + phase + edgeShift) % 3) === 0;
        bulb.classList.toggle('is-lit', lit);
      });
    }, 160);
  }

  function initLiveBulbs() {
    buildLiveBulbs();
    animateLiveBulbs();
  }

  function getCurrentPrize(prizes) {
    return prizes.find(function(prize) {
      var winners = Array.isArray(prize.winners) ? prize.winners : [];
      return winners.length < Number(prize.count || 0);
    }) || prizes[0] || null;
  }

  function detectNewWinner(prevPrizes, prizes) {
    for (var i = 0; i < prizes.length; i += 1) {
      var nextPrize = prizes[i];
      var prevPrize = prevPrizes.find(function(item) { return item.id === nextPrize.id; }) || null;
      var nextWinners = Array.isArray(nextPrize.winners) ? nextPrize.winners : [];
      var prevWinners = prevPrize && Array.isArray(prevPrize.winners) ? prevPrize.winners : [];
      if (nextWinners.length > prevWinners.length) {
        return {
          name: nextWinners[nextWinners.length - 1],
          prizeName: nextPrize.name || '',
          prizeId: nextPrize.id || ''
        };
      }
    }
    return null;
  }

  function stopLiveSpin() {
    if (liveSpinTimer) {
      clearInterval(liveSpinTimer);
      liveSpinTimer = null;
    }
    liveSpinNamesHash = '';
  }

  function setLiveState(mode, prizeName, reelText, hintText) {
    if (liveWrapEl) {
      liveWrapEl.classList.toggle('is-spinning', mode === 'spinning');
      liveWrapEl.classList.toggle('is-settled', mode === 'settled');
    }
    if (livePrizeEl) livePrizeEl.textContent = prizeName || 'Waiting for next draw';
    if (liveStatusEl) {
      liveStatusEl.textContent = mode === 'spinning'
        ? 'Drawing'
        : mode === 'settled'
          ? 'Winner'
          : 'Standby';
    }
    if (liveReelEl) liveReelEl.textContent = reelText || 'Ready';
    if (liveHintEl) liveHintEl.textContent = hintText || '';
  }

  function renderLiveSlot(prizes) {
    var currentPrize = getCurrentPrize(prizes);
    var isSpinning = getRecoveryPending();
    var recoveryNames = loadArrayStorage('draw-recovery-names');
    var namesHash = JSON.stringify(recoveryNames);

    if (isSpinning && recoveryNames.length) {
      if (liveSpinNamesHash !== namesHash) {
        stopLiveSpin();
        liveSpinNamesHash = namesHash;
        setLiveState(
          'spinning',
          currentPrize ? currentPrize.name : 'Live Draw',
          maskName(recoveryNames[0]),
          'Mirroring the homepage rolling draw in real time.'
        );
        liveSpinTimer = setInterval(function() {
          if (!liveReelEl || !recoveryNames.length) return;
          var index = Math.floor(Math.random() * recoveryNames.length);
          liveReelEl.textContent = maskName(recoveryNames[index]);
        }, 90);
      } else if (livePrizeEl && currentPrize) {
        livePrizeEl.textContent = currentPrize.name;
      }
      return;
    }

    stopLiveSpin();

    if (lastDetectedWinner && lastDetectedWinner.name) {
      setLiveState(
        'settled',
        lastDetectedWinner.prizeName || (currentPrize ? currentPrize.name : 'Latest Winner'),
        lastDetectedWinner.name,
        'Newest result from the main draw screen.'
      );
      return;
    }

    if (currentPrize) {
      setLiveState(
        'idle',
        currentPrize.name,
        'Ready',
        'Waiting for the next spin to begin.'
      );
      return;
    }

    setLiveState('idle', 'Waiting for next draw', 'Ready', 'Add prizes and participants to start drawing.');
  }

  // ── Render prize cards (combined winners + upcoming) ───────
  function renderPrizes(prizes) {
    const body = document.getElementById('prizes-body');
    body.innerHTML = '';

    prizes.forEach(p => {
      const done = p.winners.length >= p.count;
      const rem = Math.max(0, p.count - p.winners.length);
      const filled = p.count > 0 ? (p.winners.length / p.count) : 0;

      const card = document.createElement('div');
      card.className = 'prize-card' + (done ? ' prize-card--done' : '');

      // Header: name + badges
      const badgeHtml = '<div class="badge ' + (done ? 'badge--done' : 'badge--pending') + '">'
        + (done ? i18n.done : i18n.upcoming) + '</div>'
        + (p.drawTime ? '<div class="prize-card__time">⏰ ' + p.drawTime + '</div>' : '');

      const descHtml = p.description
        ? '<div class="prize-card__desc">' + p.description + '</div>' : '';

      card.innerHTML = '<div class="prize-card__header">'
        + '<div><div class="prize-card__name">' + p.name + '</div>' + descHtml + '</div>'
        + '<div class="prize-card__badges">' + badgeHtml + '</div>'
        + '</div>'
        // Remaining slots
        + '<div class="prize-card__slots">'
        + '<div class="prize-card__rem">' + rem + '</div>'
        + '<div class="prize-card__rem-label">' + i18n.spotsLine1 + '<br>' + i18n.spotsLine2 + '</div>'
        + '</div>'
        // Progress bar
        + '<div class="prize-card__progress"><div class="prize-card__progress-fill" style="width:' + Math.round(filled * 100) + '%"></div></div>';

      // Winners list
      if (p.winners.length) {
        const wrapEl = document.createElement('div');
        wrapEl.className = 'prize-card__winners';
        p.winners.forEach((w, i) => {
          const chip = document.createElement('div');
          chip.className = 'winner-chip';
          const ts = p.winnerTimestamps && p.winnerTimestamps[i] ? p.winnerTimestamps[i] : '';
          chip.innerHTML = '<span class="winner-name">' + w + '</span>'
            + (ts ? '<span class="winner-ts">' + ts + '</span>' : '');
          wrapEl.appendChild(chip);
        });
        card.appendChild(wrapEl);
      } else if (!done) {
        const pend = document.createElement('div');
        pend.className = 'prize-card__pending';
        pend.textContent = i18n.noWinnersYet;
        card.appendChild(pend);
      }

      body.appendChild(card);
    });
  }

  // ── Render ticker ──────────────────────────────────────────
  function renderTicker(prizes) {
    const content = document.getElementById('ticker-content');
    const items = prizes.flatMap(p =>
      p.winners.map(w => ({ prize: p.name, winner: w }))
    );
    if (!items.length) { content.innerHTML = '<span style="color:rgba(255,255,255,0.3);font-size:0.75rem">' + i18n.noWinnersYet + '</span>'; return; }
    content.innerHTML = items.map(it =>
      '<span class="ticker-item">'
      + '<span class="ticker-item__prize">' + it.prize + '</span>'
      + '<span class="ticker-item__sep">·</span>'
      + it.winner
      + '</span>'
    ).join('');
  }

  // ── Render stats ───────────────────────────────────────────
  function renderStats(prizes) {
    const total = prizes.reduce((s, p) => s + p.winners.length, 0);
    const rem = prizes.reduce((s, p) => s + Math.max(0, p.count - p.winners.length), 0);
    document.getElementById('stat-winners').textContent = total;
    document.getElementById('stat-remaining').textContent = rem;
    const participants = localStorage.getItem('draw-participant-count');
    const participantsEl = document.getElementById('stat-participants');
    if (participantsEl && participants !== null) participantsEl.textContent = participants;
    const seed = localStorage.getItem('draw-last-seed');
    const seedEl = document.getElementById('seed-display');
    if (seedEl && seed) {
      seedEl.textContent = i18n.seedLabel + ' · ' + seed;
      seedEl.style.display = 'block';
    }
  }

  // ── Refresh all ────────────────────────────────────────────
  let lastDataHash = '';
  function refresh() {
    const prizes = load();
    const hash = JSON.stringify(prizes);
    if (hash === lastDataHash) {
      renderLiveSlot(prizes);
      return;
    }
    var detectedWinner = detectNewWinner(previousPrizesSnapshot, prizes);
    if (detectedWinner) lastDetectedWinner = detectedWinner;
    previousPrizesSnapshot = JSON.parse(hash);
    lastDataHash = hash;
    renderPrizes(prizes);
    renderTicker(prizes);
    renderStats(prizes);
    renderLiveSlot(prizes);
  }

  // Firebase realtime sync
  const fbStatus = document.getElementById('fb-status');
  import('https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js').then(({ initializeApp }) => {
    import('https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js').then(({ getDatabase, ref, onValue }) => {
      const firebaseConfig = {
        apiKey: 'AIzaSyBzJJ3yeO-_Yozikwds9_6PPwyAn788SHU',
        databaseURL: 'https://event-luckydraw-default-rtdb.asia-southeast1.firebasedatabase.app',
        projectId: 'event-luckydraw',
        appId: '1:186125547633:web:e94e9fab2ba797ffe3c3d0'
      };
      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      onValue(ref(db, 'prizes'), function(snapshot) {
        var data = snapshot.val();
        if (data) {
          localStorage.setItem('prize-manager-data', JSON.stringify(data));
          refresh();
        }
        if (fbStatus) { fbStatus.textContent = '🟢 synced'; fbStatus.style.color = 'rgba(100,255,150,0.5)'; }
      }, function() {
        if (fbStatus) { fbStatus.textContent = '🔴 offline'; fbStatus.style.color = 'rgba(255,100,100,0.6)'; }
      });
      // Listen to countdown state from main app
      onValue(ref(db, 'countdown'), function(snapshot) {
        var state = snapshot.val();
        var raw = state ? JSON.stringify(state) : '';
        localStorage.setItem('draw-countdown', raw);
        lastCdHash = raw;
        applyCountdownState(state);
      });
    });
  }).catch(() => {
    if (fbStatus) { fbStatus.textContent = '🔴 offline'; fbStatus.style.color = 'rgba(255,100,100,0.6)'; }
  });

  applyStaticText();
  refresh();
  initLiveBulbs();
  window.addEventListener('resize', initLiveBulbs);

  // Draw title
  const drawEventTitleEl = document.getElementById('draw-event-title');
  function applyDrawTitle() {
    if (drawEventTitleEl) {
      drawEventTitleEl.textContent = localStorage.getItem('draw-title') || '';
      drawEventTitleEl.style.display = drawEventTitleEl.textContent ? 'block' : 'none';
    }
  }
  applyDrawTitle();

  // Instant sync when main app writes to localStorage on the same device
  window.addEventListener('storage', function(e) {
    if (e.key === 'prize-manager-data') refresh();
    if (e.key === 'draw-title') applyDrawTitle();
    if (e.key === 'draw-recovery-pending' || e.key === 'draw-recovery-names') refresh();
    if (e.key === 'app-lang') {
      var newLang = e.newValue;
      if (newLang === 'zh' || newLang === 'ja' || newLang === 'en' || newLang === 'my') {
        currentLang = newLang;
        applyStaticText();
        refresh();
        tick();
      }
    }
  });

  // ── Countdown (read-only, driven by main app via Firebase) ───
  let cdTimer = null;
  let cdSecs = 0;

  function fmtCd(s) {
    return String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(Math.max(0,s) % 60).padStart(2,'0');
  }

  const cdEl = document.getElementById('countdown-display');
  const cdDivider = document.getElementById('countdown-divider');
  const cdLabel = document.getElementById('countdown-label');
  const cdWrap = document.getElementById('countdown-wrap');

  function showCountdown(show) {
    if (cdDivider) cdDivider.style.display = show ? 'block' : 'none';
    if (cdWrap) cdWrap.classList.toggle('visible', show);
  }

  function getPrizeName(prizeId) {
    try {
      var prizes = load();
      var p = prizes.find(function(x) { return x.id === prizeId; });
      return p ? p.name : '';
    } catch(e) { return ''; }
  }

  function showTimesUp(prizeName) {
    showCountdown(true);
    if (cdLabel) {
      cdLabel.innerHTML = ''
        + (prizeName ? '<span class="info-cd-label__prize">' + prizeName + '</span>' : '')
        + '<span class="info-cd-label__state">' + i18n.timesUp + '</span>';
    }
    if (cdEl) { cdEl.textContent = '00:00'; }
    setTimeout(function() { showCountdown(false); }, 10000);
  }

  function applyCountdownState(state) {
    if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
    if (!state || !state.minutes) { showCountdown(false); return; }
    var prizeName = getPrizeName(state.prizeId);
    function setCountdownLabel(stateText) {
      if (!cdLabel) return;
      cdLabel.innerHTML = ''
        + (prizeName ? '<span class="info-cd-label__prize">' + prizeName + '</span>' : '')
        + '<span class="info-cd-label__state">' + stateText + '</span>';
    }
    showCountdown(true);
    if (state.running && state.startedAt) {
      var elapsed = Math.floor((Date.now() - state.startedAt) / 1000);
      cdSecs = Math.max(0, state.minutes * 60 - elapsed);
      if (cdSecs <= 0) { showTimesUp(prizeName); return; }
      cdTimer = setInterval(function() {
        cdSecs = Math.max(0, cdSecs - 1);
        if (cdEl) { cdEl.textContent = fmtCd(cdSecs); }
        if (cdSecs <= 0) { clearInterval(cdTimer); cdTimer = null; showTimesUp(prizeName); }
      }, 1000);
      setCountdownLabel(i18n.countdown);
    } else {
      cdSecs = state.pausedRemaining !== null ? state.pausedRemaining : state.minutes * 60;
      setCountdownLabel(state.pausedRemaining !== null ? i18n.paused : i18n.ready);
    }
    if (cdEl) { cdEl.textContent = fmtCd(cdSecs); }
  }

  // Poll localStorage as same-device fallback
  var lastCdHash = '';
  function pollCountdown() {
    try {
      var raw = localStorage.getItem('draw-countdown') || '';
      if (raw !== lastCdHash) {
        lastCdHash = raw;
        applyCountdownState(raw ? JSON.parse(raw) : null);
      }
    } catch(e) {}
  }
  setInterval(pollCountdown, 1000);
  applyCountdownState(null);
  setInterval(refresh, 350);

  const fsBtn = document.getElementById('fullscreen-btn');

fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
});

</script>
</body>
</html>
