<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230">
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes bulb {
      0%, 22% { opacity: 1; filter: url(#glow); }
      42%, 100% { opacity: 0.07; filter: none; }
    }
    .g0 { fill: #ffffff; animation: bulb 0.6s ease-out infinite 0s; }
    .g1 { fill: #ffffff; animation: bulb 0.6s ease-out infinite -0.2s; }
    .g2 { fill: #ffffff; animation: bulb 0.6s ease-out infinite -0.4s; }
  </style>

  <!-- g0: every 3rd dot clockwise from top-left corner -->
